name: Manual CPU checks

# Deliberately manual only. Pushes, pull requests and schedules do not run CI.
"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-cpu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      WANDB_DISABLED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.10,<2.15'
          python -m pip install -e '.[tokenize,test]' 'peft>=0.17,<1' 'accelerate>=1.10,<2' safetensors
      - name: Lint
        run: python -m ruff check src tests
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Offline smoke training
        run: dust-qlora smoke --output-dir /tmp/dust-qlora-smoke
