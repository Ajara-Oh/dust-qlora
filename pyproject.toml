[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dust-qlora"
version = "0.1.0"
description = "Local Noise-inspired forward-only LoRA training and agent transcript preparation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
tokenize = ["transformers>=5.15,<6", "tokenizers>=0.22,<1"]
train = [
  "torch>=2.10,<2.15",
  "transformers>=5.15,<6",
  "accelerate>=1.10,<2",
  "bitsandbytes>=0.48,<1",
  "safetensors>=0.5,<1",
  "peft>=0.17,<1",
]
test = ["pytest>=8,<10", "ruff>=0.12,<1", "pyyaml>=6,<7"]

[project.scripts]
dust-qlora = "dust_qlora.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
